<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Knowledge-Vault</title>

    <!-- tailwind cdn -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body>
    <header>
      <!-- nav section  -->
      <nav class="bg-gray-100 h-15">
        <div
          class="flex justify-between items-center w-full max-w-7xl mx-auto py-2"
        >
          <img class="h-10" src="./assets/logo-navbar.png" alt="" />

          <div class="flex gap-3">
            <p
              class="text-slate-800 font-semibold text-sm hover:text-green-700"
            >
              Feature
            </p>
            <p
              class="text-slate-800 font-semibold text-sm hover:text-green-700"
            >
              How It Works
            </p>
            <p
              class="text-slate-800 font-semibold text-sm hover:text-green-700"
            >
              Why It's Different
            </p>
          </div>

          <button class="bg-green-700 p-2 rounded-sm text-white font-medium  hover:bg-yellow-500">
            Get Early Access
          </button>
        </div>
      </nav>

      <!-- hero section  -->
      <div
        class="bg-[url('./assets/hero-bg.png')] bg-cover bg-center bg-no-repeat min-h-[500px] md:min-h-[600px] lg:min-h-[670px]"
      >
        <div class="flex flex-col items-center text-center py-40">
          <button
            class="px-2 py-1 text-green-600 text-sm font-medium bg-white rounded-xl"
          >
            Early Access Now Open
          </button>

          <p class="text-[36px] text-white font-bold text-center">
            Structured Thinking,
          </p>

          <p class="text-[36px] text-green-500 font-bold text-center">
            Not Just Note-Taking.
          </p>

          <p class="text-center text-white text-sm">
            A private space to store notes, links, and learning summaries —
            designed to <br />
            help you think clearly, connect ideas, and turn learning into
            long-term knowledge
          </p>

          <div class="flex gap-2 py-4 items-center">
            <button
              class="bg-green-700 p-2 rounded-sm text-white font-medium flex gap-2 items-center  hover:bg-blue-300"
            >
              Start Building Your Vault
              <img class="h-5" src="./assets/ArrowRight.png" alt="" />
            </button>

            <button
              class="border border-gray-200 p-2 rounded-sm text-gray-200 font-medium flex gap-2 items-center hover:bg-yellow-500"
            >
              <img class="h-5" src="./assets/mdi_play.png" alt="" />
              See How It Works
            </button>
          </div>
        </div>
      </div>
    </header>

    <!-- main body  -->
    <Section>
        <!-- card section  -->
    </Section>
</body>
</html>
